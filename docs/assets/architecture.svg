<text x="84" y="1710" class="head">Finite capture executor</text>
<text x="84" y="1745" class="body">200 messages · 4 MiB metadata</text>
<text x="84" y="1774" class="body">32 MiB resource · native v6</text>
<text x="84" y="1805" class="note">Read-only source above; no arbitrary RPC.</text>
</g>
