<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2020" viewBox="0 0 1200 2020" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Inside Sightglass</title>
<desc id="desc">The MCP bridge uses reader credentials to call the daemon's authenticated Unix socket. The daemon checks conversation policy and validates source evidence before admission. A read-only source provider connects the source to reader and resource services. Residency controls source-body lifetime independently of access policy; projection and lease state share window.db. Pending payloads replay until ACK. Resource discovery, acquisition and durable derivation use a private content-addressed store, with optional local speech transcription and fenced commits. Native keys stay in Mac Keychain. Local mode reads source directly; the optional Mac edge uses one bounded ordered spool and outgoing authenticated SSH to deliver finite evidence to the single Linux core, which owns WindowDB, reader ACK, processing and MCP. The candidate panel shows those ownership boundaries; the Mermaid model carries every internal edge. Link/context retrieval reads scoped canonical rows and rebuildable link/lexical indexes; an independent bounded worker publishes fenced batches. The optional semantic service keeps an encoded/queued/verified sidecar. Explicitly authorized text/query egress reaches Cloudflare BGE-M3 and Vectorize; returned candidates are re-admitted locally.</desc>
