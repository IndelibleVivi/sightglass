<text x="84" y="1939" class="note">Release only after durable core ACK.</text>
</g>
<g id="CAPTURE_BROKER">
<rect x="690" y="1600" width="446" height="354" rx="12" fill="#E7EFF1" stroke="#D9DEDE"/>
<text x="710" y="1632" class="eyebrow">INSIDE THE LINUX CORE ABOVE</text>
<text x="710" y="1710" class="head">Core capture broker</text>
<text x="710" y="1745" class="body">Plan → sealed provider evidence</text>
<text x="710" y="1774" class="body">Admission + reader ACK + outcome</text>
<text x="710" y="1805" class="note">One WindowDB writer transaction.</text>
<text x="710" y="1880" class="head">Mac offline</text>
<text x="710" y="1914" class="body">Resident reads + exact updates ACK</text>
<text x="710" y="1939" class="note">Fresh source work remains unavailable.</text>
</g>
<path class="route" d="M494 1756H690M683 1752L690 1756L683 1760"/>
<text x="514" y="1709" class="note">Outgoing SSH</text>
<text x="514" y="1734" class="note">Generation pinned</text>
<path class="route" d="M690 1820H494M501 1816L494 1820L501 1824"/>
<text x="514" y="1854" class="note">Transport ACK</text>
<text x="514" y="1879" class="note">after core commit</text>
<text x="64" y="1992" class="note">Host / namespace / credential activation fences apply. Actual old entry-point revocation is a cutover gate.</text>
