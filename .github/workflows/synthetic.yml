name: Synthetic source gates
on:
  push: {}
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: >-
    synthetic-${{ github.workflow }}-${{
      github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number)
        || format('{0}-{1}', github.event_name, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect code, workflow, packaging and documentation changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          fi
          python scripts/ci_changes.py --event "$EVENT_NAME" --base "$base" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  docs:
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra macos-wechat --extra voice
      - run: uv run python -m unittest tests.unit.test_ci_workflow
      - run: uv build
      - name: Frozen installed-wheel entrypoints and generated read
        run: uv run python scripts/check-installed-wheel.py
  portable:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # Linux voice uses the functional upstream cp312 SILK wheel in uv.lock.
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra macos-wechat --extra voice
      - name: Portable policy, migrations, recovery, links, retrieval and IPC
        run: >-
          uv run python -m unittest
          tests.unit.test_contracts tests.unit.test_runtime_config tests.unit.test_peer_credentials
          tests.unit.test_capture_boundary tests.unit.test_capture_core tests.unit.test_capture_recovery
          tests.unit.test_activation tests.unit.test_edge_runtime tests.unit.test_frozen_transfer
          tests.unit.test_edge_rebind
          tests.unit.test_edge_origin_upgrade
          tests.unit.test_source_access tests.unit.test_edge_source_access
          tests.unit.test_vault_recovery
          tests.unit.test_linux_platform tests.integration.test_capture_edge_relay
          tests.integration.test_capture_reliability
          tests.integration.test_frozen_installation tests.integration.test_replica_reads
          tests.integration.test_daemon_reliability tests.integration.test_backfill_job_progress
          tests.integration.test_runtime_lifecycle
          tests.unit.test_async_receipts tests.unit.test_runtime_operation_status
          tests.integration.test_backfill_stale_jobs tests.integration.test_caller_cancellation
          tests.integration.test_remote_caller_cancellation
          tests.integration.test_daily_recents
          tests.integration.test_foreground_catalog
          tests.integration.test_native_identity_window
          tests.unit.test_delivery_durability tests.unit.test_resource_reliability
          tests.unit.test_legacy_cas_recovery tests.unit.test_voice_workspace_recovery
          tests.integration.test_fresh_cursor_host
          tests.unit.test_schema_v2_migration tests.unit.test_schema_v3_migration
          tests.unit.test_schema_v4_migration tests.unit.test_schema_v5_migration
          tests.unit.test_schema_v6_migration tests.unit.test_schema_v8_migration
          tests.unit.test_message_links tests.unit.test_source_parser
          tests.unit.test_source_worker tests.unit.test_resource_jobs
          tests.unit.test_worker_scheduling tests.unit.test_worker_commit_wake
          tests.unit.test_storage_backups tests.unit.test_restore_recovery
          tests.unit.test_storage_budget tests.unit.test_storage_history
          tests.unit.test_storage_diagnostics tests.unit.test_cli_observation_maintenance
          tests.integration.test_reading_correctness_sequences tests.integration.test_observation_maintenance
          tests.integration.test_async_search_preparation
          tests.integration.test_cold_retrieval_discovery
          tests.integration.test_source_discovery_scan.SyntheticDiscoveryScanTests
          tests.unit.test_released_observations tests.integration.test_residency
          tests.integration.test_resident_consolidation
          tests.integration.test_derived_sweep
          tests.integration.test_compact_candidate tests.integration.test_paired_runtime
          tests.unit.test_cache_control tests.unit.test_v2_decoder tests.unit.test_semantic_benchmark
          tests.unit.test_semantic_runtime tests.unit.test_semantic_service
          tests.unit.test_cloudflare_semantic tests.integration.test_semantic_retrieval
          tests.integration.test_m2_reader tests.integration.test_retrieval
          tests.integration.test_reading_resilience tests.integration.test_materialized_read_plane
          tests.integration.test_search_candidate_window tests.integration.test_m4_daemon
          tests.contract.test_mcp_contract tests.contract.test_mcp_brief
          tests.unit.test_ci_workflow
      - run: uv run python -m compileall -q src tests examples
      - run: uv run ruff check src tests examples/benchmarks scripts/vault_gateway.py scripts/vault_recovery.py
      - run: uv build
      - name: Frozen installed-wheel entrypoints and generated read
        run: uv run python scripts/check-installed-wheel.py
  macos:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install poppler
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install optional native fixture dependencies
        run: uv sync --frozen --extra dev --extra macos-wechat --extra voice
      - run: uv run python -m unittest discover -s tests -t . -p 'test_*.py'
      - run: uv run pyright
      - run: uv build
      - name: Frozen installed-wheel entrypoints and generated read
        run: uv run python scripts/check-installed-wheel.py
